name: CI - Derle, Sürümle & VSIX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo'yu klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🔨 TypeScript derle
        run: npm run compile

      - name: 🔎 Extension giriş dosyasını doğrula
        run: |
          ENTRY=$(node -p "require('./package.json').main")
          echo "📌 Extension entrypoint: $ENTRY"
          if [ ! -f "$ENTRY" ]; then
            echo "❌ $ENTRY bulunamadı!"
            echo "Derlenen dosyalar:"
            find out -maxdepth 2 -type f -print
            exit 1
          fi
          echo "✅ Extension entrypoint hazır"

      - name: 🔢 Main'de patch sürümünü otomatik artır
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "📌 Mevcut versiyon: $CURRENT"

          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "🚀 Yeni versiyon: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: 📦 VSIX paketini oluştur
        run: npx @vscode/vsce package --allow-missing-repository

      - name: 🧪 VSIX dosyasını doğrula
        run: |
          VSIX=$(find . -maxdepth 1 -name '*.vsix' -print -quit)
          if [ -z "$VSIX" ]; then
            echo "❌ VSIX oluşturulamadı!"
            exit 1
          fi
          echo "✅ VSIX hazır: $VSIX"
          npx @vscode/vsce ls --packagePath "$VSIX" > /tmp/vsix-list.txt
          grep -q 'extension/package.json' /tmp/vsix-list.txt || {
            echo "❌ VSIX içinde package.json yok!"
            exit 1
          }

      - name: 📤 VSIX artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: pyotobaslat-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
