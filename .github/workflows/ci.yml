name: CI - Derle & Paketle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo'yu klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🟢 Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🔢 Versiyonu otomatik artır (patch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "📌 Mevcut versiyon: $CURRENT"

          NEW_VERSION=$(node -e "
            const v = '$CURRENT'.split('.');
            v[2] = parseInt(v[2]) + 1;
            console.log(v.join('.'));
          ")
          echo "🚀 Yeni versiyon: $NEW_VERSION"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push

      - name: 🔨 Derle
        run: npm run compile

      - name: 📋 Derleme çıktısını kontrol et
        run: |
          if [ ! -f out/extension.js ]; then
            echo "❌ out/extension.js bulunamadı! Derleme başarısız."
            exit 1
          fi
          echo "✅ Derleme başarılı"

      - name: 📦 VSIX paketini oluştur
        run: npx @vscode/vsce package --allow-missing-repository

      - name: 📤 VSIX artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: pyotobaslat-vsix
          path: "*.vsix"
          retention-days: 7
