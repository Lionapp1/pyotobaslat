name: CI - Doğrula, Sürümle & VSIX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Derle ve test et
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo'yu klonla
        uses: actions/checkout@v4

      - name: 🟢 Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🧪 Testleri çalıştır (derleme dahil)
        run: npm test

      - name: 🔎 Extension giriş dosyasını doğrula
        run: |
          set -euo pipefail
          ENTRY=$(node -p "require('./package.json').main")
          test -f "$ENTRY" || { echo "❌ $ENTRY bulunamadı!"; find out -maxdepth 2 -type f -print; exit 1; }
          echo "✅ Extension entrypoint hazır: $ENTRY"

  release:
    name: Sürümle ve VSIX yayımla
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Repo'yu klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🔢 Patch sürümünü artır
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          echo "📌 Mevcut sürüm: $CURRENT"

          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "🚀 Yeni sürüm: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: 🧪 Sürüm sonrası doğrulama
        run: npm test

      - name: 📦 VSIX paketini oluştur
        run: npm run vsix

      - name: 🧪 VSIX dosyasını doğrula
        run: |
          set -euo pipefail
          VSIX=$(find . -maxdepth 1 -name '*.vsix' -print -quit)
          if [ -z "$VSIX" ]; then
            echo "❌ VSIX oluşturulamadı!"
            exit 1
          fi
          echo "✅ VSIX hazır: $VSIX"

          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_VSIX="./pyotobaslat-${EXPECTED_VERSION}.vsix"
          if [ "$VSIX" != "$EXPECTED_VSIX" ]; then
            echo "❌ VSIX sürümü beklenenden farklı: $VSIX (beklenen $EXPECTED_VSIX)"
            exit 1
          fi

          unzip -l "$VSIX" > /tmp/vsix-list.txt
          for path in extension/package.json extension/out/projectDoctorExtension.js extension/LICENSE; do
            grep -q "$path" /tmp/vsix-list.txt || { echo "❌ VSIX içinde $path yok!"; exit 1; }
          done
          if grep -q 'extension/out/test/' /tmp/vsix-list.txt; then
            echo "❌ Test dosyaları VSIX içinde bulunmamalı!"
            exit 1
          fi

          unzip -p "$VSIX" extension/package.json > /tmp/vsix-package.json
          ACTUAL_VERSION=$(node -p "require('/tmp/vsix-package.json').version")
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ VSIX package.json sürümü yanlış: $ACTUAL_VERSION (beklenen $EXPECTED_VERSION)"
            exit 1
          fi

          echo "📋 VSIX içeriği doğrulandı: $VSIX"
          echo "✅ VSIX sürümü: $ACTUAL_VERSION"

      - name: 📤 VSIX artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: pyotobaslat-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14

      - name: 🚀 GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PyOtoBaşlat v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: "*.vsix"
